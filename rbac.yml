apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-sev

---

apiVersion: v1
kind: Secret
metadata:
  name: my-sev-token
  annotations: 
    kubernetes.io/service-account.name: "my-sev"
type: kubernetes.io/service-account-token

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: 
  name: pod-reader-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: my-sev
  namespace: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

